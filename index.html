<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover занимает весь экран, включая вырез; остальное запрещает масштабирование -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <!-- Запасной заголовок вкладки; основной подставляет main.js из texts.ru.js -->
  <title>Карточная RPG</title>
  <!-- Пустая иконка, чтобы браузер не писал в консоль ошибку про favicon -->
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/screens.css">
  <link rel="stylesheet" href="css/cards.css">
</head>
<body>
  <!-- Сюда router.js выводит текущий экран -->
  <div id="app"></div>

  <!-- type="module" включает ES-модули; они работают только через локальный сервер -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
