<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover занимает весь экран, включая вырез; остальное запрещает масштабирование -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <!-- Запасной заголовок вкладки; основной подставляет main.js из texts.ru.js -->
  <title>Карточная RPG</title>
  <link rel="icon" href="assets/images/icon-192.png">
  <!-- Описание приложения для установки на экран -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#15121a">
  <!-- То же для iPhone: он читает эти теги, а не manifest -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Карточная RPG">
  <link rel="apple-touch-icon" href="assets/images/icon-180.png">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/screens.css">
  <link rel="stylesheet" href="css/cards.css">
  <link rel="stylesheet" href="css/theme.css">
</head>
<body>
  <!-- Фон подземелья: отдельный слой, он не перерисовывается вместе с экранами -->
  <div id="scene"></div>
  <!-- Сюда router.js выводит текущий экран -->
  <div id="app"></div>

  <!-- type="module" включает ES-модули; они работают только через локальный сервер -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
