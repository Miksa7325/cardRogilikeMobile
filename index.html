<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover занимает весь экран, включая вырез; остальное запрещает масштабирование -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <!-- Запасной заголовок вкладки; основной подставляет main.js из texts.ru.js -->
  <title>RPG 2</title>
  <link rel="icon" href="assets/images/icon-192.png">
  <!-- Описание приложения для установки на экран -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#15121a">
  <!-- То же для iPhone: он читает эти теги, а не manifest -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RPG 2">
  <link rel="apple-touch-icon" href="assets/images/icon-180.png">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/screens.css">
  <link rel="stylesheet" href="css/cards.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/vivid.css">
  <link rel="stylesheet" href="css/vfx.css">
</head>
<body>
  <!-- Градиенты для рисунков карт: css/vivid.css заливает ими контуры, так рисунки выглядят металлическими и объёмными -->
  <svg class="art-gradients" width="0" height="0" aria-hidden="true" style="position: absolute">
    <defs>
      <linearGradient id="art-steel" x1="0" y1="0" x2="0.35" y2="1"><stop offset="0" stop-color="#dfe8f6"/><stop offset="0.35" stop-color="#b4c4de"/><stop offset="0.62" stop-color="#7f95bf"/><stop offset="0.82" stop-color="#a3b4d2"/><stop offset="1" stop-color="#56688c"/></linearGradient>
      <linearGradient id="art-gold" x1="0" y1="0" x2="0.35" y2="1"><stop offset="0" stop-color="#ffe9a0"/><stop offset="0.3" stop-color="#ffcf45"/><stop offset="0.6" stop-color="#d98a10"/><stop offset="0.82" stop-color="#e3b048"/><stop offset="1" stop-color="#9a5a00"/></linearGradient>
      <linearGradient id="art-ember" x1="0" y1="0" x2="0.35" y2="1"><stop offset="0" stop-color="#ffcf78"/><stop offset="0.3" stop-color="#ff9e2a"/><stop offset="0.6" stop-color="#f04812"/><stop offset="1" stop-color="#8a1400"/></linearGradient>
      <linearGradient id="art-frost" x1="0" y1="0" x2="0.35" y2="1"><stop offset="0" stop-color="#cdeeff"/><stop offset="0.3" stop-color="#8acfff"/><stop offset="0.62" stop-color="#3a9cff"/><stop offset="0.82" stop-color="#6cb8ee"/><stop offset="1" stop-color="#1a4fa8"/></linearGradient>
      <linearGradient id="art-poison" x1="0" y1="0" x2="0.35" y2="1"><stop offset="0" stop-color="#d6f08e"/><stop offset="0.3" stop-color="#96e842"/><stop offset="0.6" stop-color="#3fbf1a"/><stop offset="1" stop-color="#145a08"/></linearGradient>
      <linearGradient id="art-arcane" x1="0" y1="0" x2="0.35" y2="1"><stop offset="0" stop-color="#efc2ff"/><stop offset="0.3" stop-color="#d488ff"/><stop offset="0.62" stop-color="#a24aff"/><stop offset="0.82" stop-color="#bd78e6"/><stop offset="1" stop-color="#4a12a0"/></linearGradient>
      <linearGradient id="art-rose" x1="0" y1="0" x2="0.35" y2="1"><stop offset="0" stop-color="#ffbecb"/><stop offset="0.3" stop-color="#ff869e"/><stop offset="0.6" stop-color="#ff2a5a"/><stop offset="1" stop-color="#7a0828"/></linearGradient>
      <linearGradient id="art-bone" x1="0" y1="0" x2="0.35" y2="1"><stop offset="0" stop-color="#ece7d8"/><stop offset="0.35" stop-color="#d6cfb8"/><stop offset="0.65" stop-color="#9d957f"/><stop offset="1" stop-color="#4a463a"/></linearGradient>
    </defs>
  </svg>
  <!-- Фон подземелья: отдельный слой, он не перерисовывается вместе с экранами -->
  <div id="scene"></div>
  <!-- Сюда router.js выводит текущий экран -->
  <div id="app"></div>

  <!-- type="module" включает ES-модули; они работают только через локальный сервер -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
